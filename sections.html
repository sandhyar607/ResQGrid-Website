<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ResQGrid</title>
<style>
:root{
  --bg:#f7f4e3; --ink:#0b2a5b; --btn:#0b5a8f; --btn-hover:#094a76; --btn-text:#fff; --status:#0b5a8f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;padding:24px;box-sizing:border-box;overflow-x:hidden}
.brand{display:flex;align-items:center;justify-content:center;gap:24px;flex-wrap:wrap}
.brand img{width:min(760px,92vw);height:auto;display:block;mix-blend-mode:multiply}
.menu{display:flex;flex-direction:column;gap:18px;width:min(380px,100%)}
.menu button{background:var(--btn);color:var(--btn-text);border:0;border-radius:12px;padding:20px 24px;font-size:20px;font-family:inherit;cursor:pointer;box-shadow:0 8px 20px rgba(11,90,143,.3);transition:transform .15s,background .15s}
.menu button:hover{background:var(--btn-hover);transform:translateY(-2px)}
.menu button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#status{min-height:24px;color:var(--status);font-size:18px;text-align:center}
</style>

<div class="menu">
  <button type="button">Operations Dashboard</button>
  <button type="button">City Monitoring</button>
  <button type="button">Administration &amp; Reports</button>
</div>
<div id="status" aria-live="polite"></div>

<script>
const menu = document.querySelector('.menu');
menu.hidden = true;
function readToken() {
  const handoff = new URLSearchParams(location.hash.slice(1)).get('rq-session');
  if (handoff) { localStorage.setItem('resqgrid.session', JSON.stringify({ token: handoff })); history.replaceState(history.state, '', location.pathname + location.search); return handoff; }
  const tabToken = window.name.startsWith('resqgrid-session:') ? window.name.slice('resqgrid-session:'.length) : '';
  if (tabToken) { localStorage.setItem('resqgrid.session', JSON.stringify({ token: tabToken })); return tabToken; }
  try { const session = JSON.parse(localStorage.getItem('resqgrid.session') || 'null'); if (session?.token) return session.token; } catch { localStorage.removeItem('resqgrid.session'); }
  return '';
}
async function verifyOfficer() {
  const token = readToken();
  if (!token) { window.location.replace('./login.html'); return; }
  try {
    const response = await fetch('http://127.0.0.1:5177/api/auth/session', { headers: { Authorization: 'Bearer ' + token } });
    const data = await response.json();
    if (response.ok && String(data.user?.role || '').startsWith('Government Officer')) {
      localStorage.setItem('resqgrid.session', JSON.stringify({ token, user: data.user }));
      menu.hidden = false;
    } else if (response.ok && data.user?.role !== undefined) {
      window.location.replace('./public-dashboard.html');
    } else {
      localStorage.removeItem('resqgrid.session'); window.name = ''; window.location.replace('./login.html');
    }
  } catch { document.getElementById('status').textContent = 'Could not verify your officer session. Return to sign in and try again.'; }
}
void verifyOfficer();
document.querySelectorAll('.menu button').forEach(function(b){
  b.addEventListener('click',function(){
    const index = Array.from(document.querySelectorAll('.menu button')).indexOf(b);
    const token = JSON.parse(localStorage.getItem('resqgrid.session') || '{}').token || '';
    const destinations = ['http://127.0.0.1:5174/', 'http://127.0.0.1:5175/', 'http://127.0.0.1:5176/'];
    window.location.href = destinations[index] + '#rq-session=' + encodeURIComponent(token);
  });
});
</script>
